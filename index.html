<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Văn Học Mở | Không gian học tập</title>
<meta name="description" content="Văn Học Mở — không gian đọc hiểu tác phẩm văn học và theo dõi tiến độ học tập." />
<meta name="theme-color" content="#245b49" />


<style>
:root{--ink:#202b27;--muted:#748079;--paper:#f6f5ef;--white:#fff;--green:#245b49;--green2:#367660;--mint:#e8f2ec;--gold:#e7bd67;--line:#e4e8e0;--rose:#f8e9e4;--blue:#eaf0fa;--shadow:0 14px 40px #20392b0d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:750;transition:.15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:var(--green);color:white}.secondary{background:var(--mint);color:var(--green)}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.soft{background:#f4f2e9;color:#6f5a2f}.danger{background:var(--rose);color:#973d2b}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px 26px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;letter-spacing:-.6px}.brandmark{width:44px;height:44px;background:var(--green);border-radius:15px;display:grid;place-items:center;color:white;font-size:22px}.brand small{display:block;font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:750;margin-top:1px}.userbar{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#e8d8bd;color:#705329;border-radius:50%;font-weight:900}.panel{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;color:var(--green2)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,4vw,50px);line-height:1.08;letter-spacing:-1.9px;margin:15px 0}h2{font-size:27px;letter-spacing:-.8px;margin-bottom:8px}h3{font-size:18px;letter-spacing:-.3px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.lead{font-size:16px;line-height:1.7;color:#626e66}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grid{display:grid;gap:18px}.hero{grid-template-columns:1.1fr .9fr;align-items:stretch}.hero-art{min-height:315px;background:linear-gradient(145deg,#224c3f,#397761);border-radius:22px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:28px;color:white}.hero-art:before{content:"✳";position:absolute;right:10px;top:-50px;font-size:250px;color:#ffffff12}.hero-art:after{content:"文";position:absolute;right:35px;top:20px;font-size:150px;line-height:1;color:#ffffff1a;font-weight:900}.art-copy{position:relative;z-index:1;max-width:330px}.art-copy h2{font-size:30px}.pill{display:inline-flex;padding:7px 10px;border-radius:100px;background:var(--mint);color:var(--green);font-size:11px;font-weight:800;letter-spacing:.3px;align-items:center;gap:6px}.pill.gold{background:#fff3d9;color:#876323}.stats{grid-template-columns:repeat(3,1fr);margin-top:18px}.stat{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line)}.stat strong{font-size:25px;display:block;letter-spacing:-.7px}.stat span{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:34px 0 16px}.section-head p{margin:0}.work-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.work-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:250px}.work-cover{height:106px;display:flex;align-items:end;padding:15px;color:#fff;position:relative;overflow:hidden}.work-cover:after{content:attr(data-mark);position:absolute;right:10px;top:-22px;font-size:108px;line-height:1;color:#ffffff22;font-weight:900}.cover-green{background:linear-gradient(130deg,#275642,#6d9871)}.cover-blue{background:linear-gradient(130deg,#394f76,#8c9eba)}.cover-rose{background:linear-gradient(130deg,#914f47,#d59c7f)}.cover-gold{background:linear-gradient(130deg,#79613b,#c6a45a)}.cover-violet{background:linear-gradient(130deg,#554b71,#a39ac0)}.cover-teal{background:linear-gradient(130deg,#286d70,#75b1a6)}.work-body{padding:17px;display:flex;flex-direction:column;flex:1}.work-meta{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.9px}.work-body p{font-size:13px;line-height:1.55;color:#66736a;margin:8px 0 16px}.work-body .row{margin-top:auto;justify-content:space-between}.progress{height:7px;border-radius:8px;background:#e8ece7;overflow:hidden}.progress span{display:block;height:100%;background:var(--green2);border-radius:8px}.form-label{font-size:12px;font-weight:800;display:block;margin:13px 0 7px}.field{width:100%;border:1px solid #dce2da;background:#fcfcf9;border-radius:12px;padding:12px 13px;outline:none;color:var(--ink)}.field:focus{border-color:var(--green2);box-shadow:0 0 0 3px #36766015}.login-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login-left{background:var(--green);color:white;padding:56px clamp(28px,6vw,90px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.login-left:after{content:"❧";position:absolute;bottom:2%;right:-5%;font-size:310px;color:#ffffff0d;transform:rotate(-15deg)}.login-left h1{max-width:600px;font-size:clamp(38px,5vw,62px)}.login-left p{max-width:490px;color:#d0e2d7;line-height:1.8}.login-left .eyebrow{color:#d6bb73}.login-right{display:grid;place-items:center;padding:34px}.login-card{width:min(100%,440px)}.role-switch{display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:13px;background:#eff1eb;margin:24px 0}.role-switch button{background:transparent;color:var(--muted)}.role-switch button.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #20392b12}.demo{font-size:12px;line-height:1.6;padding:13px 14px;background:#f5f4ee;border-radius:12px;margin-top:17px;color:#647067}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#22372e;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.chip{border:1px solid var(--line);background:#fff;color:#58665d;border-radius:99px;padding:9px 13px;font-size:13px}.chip.selected{background:var(--green);border-color:var(--green);color:#fff}.prefs-layout{grid-template-columns:.7fr 1.3fr;align-items:start}.note{background:#fff8e7;border:1px solid #f1e2bb;border-radius:15px;padding:15px;font-size:13px;color:#77643a;line-height:1.6}.reading-layout{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.reading-text{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.95;white-space:pre-line;color:#33433a}.reading-title{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:-.6px}.quote{border-left:3px solid var(--gold);padding:8px 0 8px 17px;color:#58655c;font-style:italic;margin:20px 0}.quiz-option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:14px;border-radius:13px;margin:9px 0;cursor:pointer;line-height:1.5}.quiz-option input{margin-top:5px;accent-color:var(--green)}.quiz-option:has(input:checked){border-color:var(--green2);background:#f1f7f2}.quiz-question{padding:18px 0;border-bottom:1px solid var(--line)}.teacher-grid{grid-template-columns:1.4fr .8fr;align-items:start}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.status{font-size:11px;font-weight:850;padding:6px 9px;border-radius:99px;background:#eff3ed;color:#427354}.status.in-progress{background:#fff3dc;color:#86672c}.status.not-started{background:#edf0f3;color:#6b7580}.student-row{cursor:pointer}.student-row:hover{background:#fafbf8}.barline{display:grid;grid-template-columns:100px 1fr 38px;align-items:center;gap:9px;margin:14px 0;font-size:12px}.barline .progress{height:9px}.empty{padding:30px;text-align:center;color:var(--muted)}.backlink{background:transparent;border:0;color:var(--green2);padding:0;font-weight:800}.footer{font-size:11px;color:#99a199;text-align:center;margin-top:32px}.answer-tag{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;border-radius:8px}.correct{color:#267349;background:#e4f5ea}.incorrect{color:#9e4b3e;background:#fbe9e5}.activity-list{display:grid;gap:10px}.activity{display:flex;gap:11px;align-items:flex-start;font-size:13px;padding:12px;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;flex:none}
@media(max-width:850px){.hero,.prefs-layout,.reading-layout,.teacher-grid{grid-template-columns:1fr}.work-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.login-shell{grid-template-columns:1fr}.login-left{display:none}.login-right{min-height:100vh}.stats{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.userbar>span{display:none}}
@media(max-width:560px){.wrap{padding:16px}.work-grid{grid-template-columns:1fr}.panel{padding:20px}.section-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.reading-text{font-size:17px}.topbar{margin-bottom:18px}.brand{font-size:17px}}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:#eff1eb;margin:18px 0}.auth-tabs button{background:transparent;color:var(--muted);padding:9px}.auth-tabs button.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #20392b12}.auth-message{font-size:13px;line-height:1.6;margin-top:12px;color:#267349}.auth-message.error{color:#ac4536}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
let WORKS=[];
const TAGS=['Thơ','Truyện','Tình bạn','Tình yêu','Gia đình','Thiên nhiên','Xã hội','Chiến tranh','Cảm xúc','Hài hước','Tâm lý','Đời sống'];
let state={user:null,screen:'login',role:'student',authMode:'login',authMessage:'',authMessageError:false,selectedTags:[],activeWork:null,quizAnswers:{},quizIndex:0,cloudError:''};
let db=null,cloudUsers=[],cloudProgress={};
const $=id=>document.getElementById(id);
function getUsers(){return cloudUsers}
function getProgress(){return cloudProgress}
function getUserProgress(id){return cloudProgress[id]||{works:{},sessions:[]}}
function userInitials(name){return name.split(' ').slice(-2).map(s=>s[0]).join('').toUpperCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}
function header(){return `<header class="topbar"><div class="brand"><div class="brandmark">文</div><div>VĂN HỌC MỞ<small>HỌC ĐỌC · SUY NGẪM · TRƯỞNG THÀNH</small></div></div>${state.user?`<div class="userbar"><div class="avatar">${esc(userInitials(state.user.name))}</div><span><b style="color:var(--ink)">${esc(state.user.name)}</b><br>${state.user.role==='teacher'?'Giáo viên':`Học sinh · ${esc(state.user.className||'')}`}</span><button class="ghost" onclick="logout()">Đăng xuất</button></div>`:''}</header>`}
function render(syncUrl=true){if(syncUrl)syncUrlForState();const app=$('app');if(!state.user){app.innerHTML=loginView();return}if(state.user.role==='teacher'){app.innerHTML=teacherView();return}if(state.screen==='preferences'){app.innerHTML=header()+preferencesView();return}if(state.screen==='reading'){app.innerHTML=header()+readingView();return}if(state.screen==='quiz'){app.innerHTML=header()+quizView();return}if(state.screen==='result'){renderResult();return}app.innerHTML=header()+studentView()}
let lastNavigationHash=location.hash;
function routeForState(){if(!state.user)return state.authMode==='signup'?'#/signup':'#/login';if(state.user.role==='teacher')return '#/teacher';if(state.screen==='preferences')return '#/discover';if(state.activeWork&&['reading','quiz','result'].includes(state.screen))return `#/works/${encodeURIComponent(state.activeWork)}/${state.screen==='reading'?'read':state.screen}`;return '#/home'}
function syncUrlForState(){const route=routeForState();if(location.hash!==route)history.pushState({vhm:true},'',route);lastNavigationHash=route}
function applyRouteFromHash(){const rawHash=location.hash.startsWith('#/')?location.hash.slice(2):location.hash.replace(/^#/,'');const parts=rawHash.split('/').filter(Boolean).map(part=>{try{return decodeURIComponent(part)}catch{return part}});if(!state.user){state.screen='login';state.authMode=parts[0]==='signup'?'signup':'login';return}if(state.user.role==='teacher'){state.screen='home';return}if(parts[0]==='discover'){state.screen='preferences';return}if(parts[0]==='works'&&parts[1]){const work=getWork(parts[1]);if(!work){state.screen='home';state.activeWork=null;return}state.activeWork=work.id;const progress=getUserProgress(state.user.id).works[work.id]||{};if(parts[2]==='quiz')state.screen='quiz';else if(parts[2]==='result'&&progress.lastResult){state.screen='result';state.result=progress.lastResult}else state.screen='reading';return}state.screen='home'}function handleHistoryNavigation(){if(location.hash===lastNavigationHash)return;applyRouteFromHash();const route=routeForState();if(location.hash!==route)history.replaceState({vhm:true},'',route);lastNavigationHash=route;render(false)}window.addEventListener('popstate',handleHistoryNavigation);window.addEventListener('hashchange',handleHistoryNavigation);
function loginView(){const signup=state.authMode==='signup';return `<div class="login-shell"><section class="login-left"><div class="brand" style="color:white"><div class="brandmark" style="background:#ffffff20">文</div><div>VĂN HỌC MỞ<small style="color:#c9dcd1">KHÔNG GIAN HỌC TẬP SỐ</small></div></div><div><div class="eyebrow">Đọc để hiểu mình, hiểu người</div><h1>Mỗi trang sách mở ra một cách nhìn mới.</h1><p>Một không gian học Ngữ văn nơi học sinh khám phá tác phẩm theo sở thích, luyện tập sau khi đọc và nhìn thấy hành trình tiến bộ của chính mình.</p></div><div style="font-size:12px;color:#c2d8cb;position:relative;z-index:1">© Văn Học Mở · Dữ liệu đồng bộ qua đám mây</div></section><section class="login-right"><div class="login-card"><div class="eyebrow">Chào mừng bạn</div><h2 style="margin-top:10px">${signup?'Tạo tài khoản':'Đăng nhập'}</h2><p class="muted">${signup?'Học sinh đăng ký trực tiếp. Tài khoản giáo viên cần được duyệt.':'Chọn vai trò và dùng email để tiếp tục.'}</p><div class="auth-tabs"><button class="${!signup?'active':''}" onclick="setAuthMode('login')">Đăng nhập</button><button class="${signup?'active':''}" onclick="setAuthMode('signup')">Tạo tài khoản</button></div>${signup?`<form onsubmit="registerAccount(event)"><label class="form-label" for="reg-name">Họ và tên</label><input class="field" id="reg-name" autocomplete="name" maxlength="100" required><label class="form-label" for="reg-class">Lớp</label><input class="field" id="reg-class" maxlength="40" placeholder="Ví dụ: 8A"><label class="form-label" for="reg-email">Email</label><input class="field" id="reg-email" type="email" autocomplete="email" required><label class="form-label" for="reg-password">Mật khẩu (ít nhất 8 ký tự)</label><input class="field" id="reg-password" type="password" autocomplete="new-password" minlength="8" required><label class="form-label" style="display:flex;align-items:center;gap:9px;font-weight:700"><input id="teacher-request" type="checkbox" onchange="toggleTeacherRequest()"> Tôi là giáo viên và muốn yêu cầu cấp quyền</label><div id="teacher-request-info" class="note hidden">Tài khoản sẽ được tạo ở trạng thái học sinh cho đến khi quản trị viên xác minh và cấp quyền giáo viên.</div><div id="signup-message" class="auth-message ${state.authMessageError?'error':''}">${esc(state.authMessage||'')}</div><button class="primary" style="width:100%;margin-top:18px;padding:14px" type="submit">Tạo tài khoản →</button></form>`:`<div class="role-switch"><button class="${state.role==='student'?'active':''}" onclick="setRole('student')">🎒 Học sinh</button><button class="${state.role==='teacher'?'active':''}" onclick="setRole('teacher')">📚 Giáo viên</button></div><form onsubmit="login(event)"><label class="form-label" for="email">Email</label><input class="field" id="email" type="email" autocomplete="username" placeholder="ten@example.com" required><label class="form-label" for="password">Mật khẩu</label><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><div id="login-error" style="color:#ac4536;font-size:12px;margin-top:10px">${esc(state.authMessage||'')}</div><div id="cloud-setup-error" class="note ${state.cloudError?'':'hidden'}" style="margin-top:12px">${esc(state.cloudError)}</div><button class="primary" style="width:100%;margin-top:18px;padding:14px" type="submit">Đăng nhập →</button></form><div class="demo"><b>Tài khoản dùng chung</b><br>Dùng cùng email và mật khẩu trên các thiết bị.</div>`}<p class="small muted" style="margin-top:18px;line-height:1.6">Mật khẩu được xác thực bởi Supabase Auth. Tiến độ được lưu trong database của lớp học.</p></div></section></div>`}function setRole(role){state.role=role;render()}function setAuthMode(mode){state.authMode=mode;state.authMessage='';state.authMessageError=false;render()}
function toggleTeacherRequest(){const info=document.getElementById('teacher-request-info');if(info)info.classList.toggle('hidden',!document.getElementById('teacher-request').checked)}
async function registerAccount(e){e.preventDefault();const message=document.getElementById('signup-message');message.textContent='';message.classList.remove('error');if(!db){message.textContent='Chưa cấu hình kết nối Supabase. Hãy làm theo SUPABASE_SETUP.md.';message.classList.add('error');return}const fullName=document.getElementById('reg-name').value.trim(),className=document.getElementById('reg-class').value.trim(),email=document.getElementById('reg-email').value.trim(),password=document.getElementById('reg-password').value,teacherRequest=document.getElementById('teacher-request').checked;const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:fullName,class_name:className,teacher_access_request:teacherRequest}}});if(error){message.textContent='Không tạo được tài khoản: '+error.message;message.classList.add('error');return}state.authMode='login';state.authMessage=teacherRequest?'Đã gửi yêu cầu tài khoản giáo viên. Hãy xác nhận email nếu được yêu cầu; quản trị viên cần duyệt quyền giáo viên.':'Tạo tài khoản thành công. Hãy xác nhận email nếu được yêu cầu, sau đó đăng nhập với vai trò Học sinh.';state.authMessageError=false;render()}
async function login(e){e.preventDefault();const errorBox=$('login-error');errorBox.textContent='';if(!db){errorBox.textContent='Chưa cấu hình kết nối Supabase. Hãy làm theo SUPABASE_SETUP.md.';return}const email=$('email').value.trim(),password=$('password').value;const {data,error}=await db.auth.signInWithPassword({email,password});if(error){errorBox.textContent='Không đăng nhập được. Hãy kiểm tra email, mật khẩu và xác nhận email trong Supabase.';return}try{await loadCloudWorkspace(data.user);if(state.user.role!==state.role){await db.auth.signOut();state.user=null;cloudUsers=[];cloudProgress={};errorBox.textContent='Vai trò tài khoản không khớp lựa chọn. Hãy chọn đúng vai trò rồi đăng nhập lại.';return}state.selectedTags=[];render()}catch(err){await db.auth.signOut();state.user=null;errorBox.textContent='Không tải được hồ sơ/dữ liệu: '+err.message}}
async function logout(){if(db)await db.auth.signOut();state.user=null;state.screen='login';state.activeWork=null;state.quizAnswers={};cloudUsers=[];cloudProgress={};render()}


function allWorksForStudent(){const p=getUserProgress(state.user.id);return WORKS.map(w=>({...w,progress:p.works[w.id]||{status:'not-started',attempts:0}}))}
function studentView(){const works=allWorksForStudent(),done=works.filter(w=>w.progress.status==='completed').length,inprogress=works.filter(w=>w.progress.status==='reading'||w.progress.status==='quiz').length,attempts=works.reduce((s,w)=>s+(w.progress.attempts||0),0);const continueWork=works.find(w=>w.progress.status==='reading'||w.progress.status==='quiz')||works.find(w=>w.progress.status==='not-started')||works[0];return `<main class="wrap"><section class="grid hero"><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><div class="eyebrow">Góc học tập của bạn</div><h1>Xin chào, ${esc(state.user.name.split(' ').slice(-1)[0])} 👋</h1><p class="lead">Mỗi tác phẩm là một hành trình. Hôm nay bạn muốn khám phá câu chuyện nào?</p><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="primary" onclick="startPreferences()">＋ Khám phá tác phẩm mới</button><button class="ghost" onclick="continueLearning('${continueWork.id}')">↗ Học tiếp</button></div><div class="stats"><div class="stat"><strong>${done}</strong><span>Tác phẩm hoàn thành</span></div><div class="stat"><strong>${inprogress}</strong><span>Đang học</span></div><div class="stat"><strong>${attempts}</strong><span>Lượt làm bài</span></div></div></div><div class="hero-art"><div class="art-copy"><span class="pill gold">Gợi ý hôm nay</span><h2>${esc(continueWork.title)}</h2><p style="color:#d6e4dc;line-height:1.6;font-size:13px">${esc(continueWork.description)}</p><button style="background:#fff;color:var(--green)" onclick="continueLearning('${continueWork.id}')">${continueWork.progress.status==='reading'||continueWork.progress.status==='quiz'?'Tiếp tục học':'Bắt đầu đọc'} →</button></div></div></section><div class="section-head"><div><div class="eyebrow">Tiến trình cá nhân</div><h2 style="margin:7px 0 4px">Học tiếp</h2><p class="muted small">Các tác phẩm bạn đã bắt đầu hoặc có thể đọc tiếp.</p></div><button class="ghost" onclick="startPreferences()">Tìm tác phẩm phù hợp</button></div><section class="grid work-grid">${works.filter(w=>w.progress.status==='reading'||w.progress.status==='quiz').length?works.filter(w=>w.progress.status==='reading'||w.progress.status==='quiz').map(workCard).join(''):`<div class="panel empty" style="grid-column:1/-1"><div style="font-size:28px;margin-bottom:8px">📖</div><b>Bạn chưa có tác phẩm đang học</b><p class="small">Chọn tác phẩm mới để bắt đầu hành trình nhé.</p></div>`}</section><div class="section-head"><div><div class="eyebrow">Thư viện chọn lọc</div><h2 style="margin:7px 0 4px">Tác phẩm nổi bật</h2><p class="muted small">Bắt đầu với một tác phẩm được giới thiệu trong thư viện.</p></div><span class="pill">${WORKS.length} tác phẩm</span></div><section class="grid work-grid">${works.slice(0,3).map(workCard).join('')}</section><div class="footer">Văn Học Mở · Tiến độ học tập được đồng bộ qua database.</div></main>`}
function workCard(w){const pr=w.progress||{status:'not-started'},status=pr.status==='completed'?'Đã hoàn thành':pr.status==='reading'?'Đang đọc':pr.status==='quiz'?'Đang làm bài':'Chưa bắt đầu';return `<article class="work-card"><div class="work-cover ${w.cover}" data-mark="${esc(w.mark)}"><span class="pill" style="background:#ffffffdd;color:#2e4d3e">${esc(w.level)}</span></div><div class="work-body"><div class="work-meta">${esc(w.period)} · ${esc(w.genre)}</div><h3 style="margin-top:7px">${esc(w.title)}</h3><div class="small muted">${esc(w.author)}</div><p>${esc(w.description)}</p><div class="row"><span class="small muted">${status}</span><button class="secondary" onclick="${pr.status==='reading'||pr.status==='quiz'?`continueLearning('${w.id}')`:`openWork('${w.id}')`}">${pr.status==='completed'?'Đọc lại':'Mở bài'} →</button></div></div></article>`}
function startPreferences(){state.screen='preferences';state.selectedTags=[];render()}
function preferencesView(){return `<main class="wrap"><button class="backlink" onclick="goHome()">← Về góc học tập</button><div style="margin:20px 0 24px"><div class="eyebrow">Cá nhân hóa hành trình</div><h1 style="font-size:40px;margin:10px 0">Bạn thích đọc về điều gì?</h1><p class="lead" style="max-width:680px">Chọn một hoặc nhiều chủ đề bạn quan tâm. Hệ thống sẽ ưu tiên gợi ý tác phẩm có nội dung gần với sở thích của bạn.</p></div><section class="grid prefs-layout"><aside class="panel"><h3>Chọn sở thích</h3><p class="muted small">Có thể chọn nhiều chủ đề.</p><div class="chips">${TAGS.map(t=>`<button class="chip ${state.selectedTags.includes(t)?'selected':''}" onclick="toggleTag('${t}')">${state.selectedTags.includes(t)?'✓ ':''}${t}</button>`).join('')}</div><div class="note" style="margin-top:20px">💡 <b>Mẹo:</b> Chọn cả thể loại (ví dụ “Thơ”) và chủ đề (ví dụ “Tình bạn”) để gợi ý sát hơn.</div><button class="primary" style="width:100%;margin-top:18px" onclick="recommendWorks()">Gợi ý tác phẩm phù hợp →</button></aside><section><div class="row between" style="margin-bottom:12px"><h3 style="margin:0">Thư viện tác phẩm</h3><span class="small muted" id="recommend-label">Chọn sở thích để sắp xếp</span></div><div id="recommend-list" class="grid work-grid">${WORKS.slice(0,3).map(w=>workCard({...w,progress:getUserProgress(state.user.id).works[w.id]||{status:'not-started'}})).join('')}</div></section></section><div class="footer">Gợi ý dựa trên thẻ chủ đề được gắn cho từng tác phẩm trong thư viện demo.</div></main>`}
function toggleTag(tag){state.selectedTags=state.selectedTags.includes(tag)?state.selectedTags.filter(t=>t!==tag):[...state.selectedTags,tag];render()}
function recommendWorks(){const selected=state.selectedTags;const progress=getUserProgress(state.user.id);let matched=WORKS.map(w=>({...w,score:w.tags.filter(t=>selected.includes(t)).length,progress:progress.works[w.id]||{status:'not-started'}})).sort((a,b)=>b.score-a.score);if(!selected.length)toast('Bạn chưa chọn sở thích, đang hiển thị thư viện nổi bật.');$('recommend-label').textContent=selected.length?`Ưu tiên ${selected.length} chủ đề`:'Tất cả tác phẩm';$('recommend-list').innerHTML=matched.map(w=>workCard(w)).join('');if(selected.length&&matched[0].score===0)toast('Chưa có tác phẩm khớp hoàn toàn; đây là gợi ý gần nhất.');}
function getWork(id){return WORKS.find(w=>w.id===id)}
async function updateProgress(workId,patch,activity){const all=getProgress(),userId=state.user.id,previous=all[userId]||{works:{},sessions:[]},old=previous.works[workId]||{status:'not-started',attempts:0},updatedAt=new Date().toISOString(),nextWork={...old,...patch,updatedAt};const {error}=await db.from('learning_progress').upsert({user_id:userId,work_id:workId,data:nextWork,updated_at:updatedAt},{onConflict:'user_id,work_id'});if(error){toast('Lưu tiến độ thất bại: '+error.message);return false}const p={...previous,works:{...previous.works,[workId]:nextWork},sessions:[...(previous.sessions||[])]};all[userId]=p;if(activity){const result=await db.from('learning_sessions').insert({user_id:userId,work_id:workId,activity});if(result.error)toast('Đã lưu tiến độ nhưng chưa lưu được hoạt động: '+result.error.message);else p.sessions.unshift({workId,activity,at:updatedAt})}return true}
async function openWork(id){state.activeWork=id;const old=getUserProgress(state.user.id).works[id]||{};if(!await updateProgress(id,{status:'reading',startedAt:old.startedAt||new Date().toISOString()},'Bắt đầu đọc'))return;state.screen='reading';render()}
function continueLearning(id){const pr=getUserProgress(state.user.id).works[id];if(pr?.status==='quiz'){state.activeWork=id;state.quizAnswers={};state.screen='quiz';render()}else openWork(id)}
function goHome(){state.screen='home';render()}
function readingView(){const w=getWork(state.activeWork);if(!w){goHome();return ''}return `<main class="wrap"><button class="backlink" onclick="goHome()">← Về góc học tập</button><div class="row between" style="margin:20px 0;flex-wrap:wrap"><div><div class="eyebrow">Không gian đọc</div><p class="muted small" style="margin:7px 0 0">${esc(w.period)} · ${esc(w.author)}</p></div><span class="pill">Bước 1 / 2 · Đọc tác phẩm</span></div><section class="grid reading-layout"><article class="panel"><div class="work-meta">${esc(w.genre)}</div><h1 class="reading-title">${esc(w.title)}</h1><p class="muted">${esc(w.author)}</p><div class="quote">${esc(w.intro)}</div><div class="reading-text">${esc(w.reading)}</div><div style="border-top:1px solid var(--line);margin-top:25px;padding-top:22px" class="row between"><span class="small muted">Đọc kỹ trước khi làm câu hỏi kiểm tra.</span><button class="primary" onclick="goQuiz()">Đọc xong · Tiếp tục →</button></div></article><aside class="grid"><div class="panel"><div class="eyebrow">Gợi ý đọc hiểu</div><h3 style="margin-top:8px">Đọc chủ động</h3><p class="small muted" style="line-height:1.7">Trong lúc đọc, hãy chú ý nhân vật trung tâm, bối cảnh, chi tiết nổi bật và cảm xúc hoặc thông điệp của tác phẩm.</p><div class="progress"><span style="width:50%"></span></div><p class="small muted" style="margin:8px 0 0">Tiến trình: Đang đọc</p></div><div class="panel"><div class="eyebrow">Chủ đề</div><div class="chips" style="margin-bottom:0">${w.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div></aside></section><div class="footer">Nội dung tóm lược trong bản demo nhằm hỗ trợ đọc hiểu, không thay thế văn bản tác phẩm đầy đủ.</div></main>`}
async function goQuiz(){if(!await updateProgress(state.activeWork,{status:'quiz',readAt:new Date().toISOString()},'Hoàn tất phần đọc'))return;state.screen='quiz';state.quizAnswers={};render()}
function quizView(){const w=getWork(state.activeWork);if(!w){goHome();return ''}return `<main class="wrap"><button class="backlink" onclick="state.screen='reading';render()">← Quay lại phần đọc</button><div style="margin:20px 0"><div class="eyebrow">Kiểm tra sau khi đọc</div><h1 style="font-size:40px;margin:10px 0">Bạn hiểu tác phẩm đến đâu?</h1><p class="lead">${esc(w.title)} · ${w.questions.length} câu hỏi trắc nghiệm</p></div><form onsubmit="submitQuiz(event)"><section class="panel"><div class="row between"><h2>${esc(w.title)}</h2><span class="pill">Bước 2 / 2 · Làm bài</span></div>${w.questions.map((q,i)=>`<div class="quiz-question"><b>Câu ${i+1}.</b> ${esc(q.q)}${q.opts.map((o,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}" ${state.quizAnswers[i]===j?'checked':''} required><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}<div class="row between" style="margin-top:22px;flex-wrap:wrap"><span class="small muted">Câu trả lời và kết quả sẽ được lưu để giáo viên theo dõi.</span><button type="submit" class="primary">Nộp bài và xem kết quả →</button></div></section></form></main>`}
async function submitQuiz(e){e.preventDefault();const w=getWork(state.activeWork),answers=w.questions.map((q,i)=>Number(new FormData(e.target).get('q'+i))),correct=answers.filter((a,i)=>a===w.questions[i].a).length,score=Math.round(correct/w.questions.length*100),old=getUserProgress(state.user.id).works[w.id]||{};const attempt={score,correct,total:w.questions.length,answers,submittedAt:new Date().toISOString(),details:w.questions.map((q,i)=>({question:q.q,selected:q.opts[answers[i]],correctAnswer:q.opts[q.a],isCorrect:answers[i]===q.a,explanation:q.why}))};const attempts=[...(old.results||[]),attempt];if(!await updateProgress(w.id,{status:'completed',attempts:attempts.length,score,lastResult:attempt,results:attempts,completedAt:new Date().toISOString()},`Hoàn thành bài kiểm tra · ${score}%`))return;state.screen='result';state.result=attempt;renderResult()}
function renderResult(){syncUrlForState();const app=$('app'),w=getWork(state.activeWork),r=state.result;app.innerHTML=header()+`<main class="wrap"><section class="panel" style="max-width:780px;margin:24px auto;text-align:center;padding:clamp(24px,5vw,50px)"><div style="font-size:48px">${r.score>=70?'🎉':'🌱'}</div><div class="eyebrow" style="margin-top:12px">Kết quả của bạn</div><h1 style="font-size:44px;margin:12px">${r.score}/100 điểm</h1><p class="lead">Bạn trả lời đúng <b>${r.correct}/${r.total}</b> câu hỏi trong tác phẩm <b>${esc(w.title)}</b>.</p><div class="progress" style="height:11px;max-width:440px;margin:22px auto"><span style="width:${r.score}%"></span></div><p class="muted">${r.score>=70?'Bạn đã nắm được nhiều ý chính. Hãy xem lại phần giải thích để ghi nhớ sâu hơn.':'Đừng nản nhé! Đọc lại phần giải thích, sau đó bạn có thể thử một tác phẩm khác.'}</p><div style="text-align:left;margin-top:30px">${r.details.map((d,i)=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="row between"><b class="small">Câu ${i+1}. ${esc(d.question)}</b><span class="answer-tag ${d.isCorrect?'correct':'incorrect'}">${d.isCorrect?'Đúng':'Chưa đúng'}</span></div><p class="small" style="margin:9px 0 4px">Bạn chọn: ${esc(d.selected)}</p>${!d.isCorrect?`<p class="small" style="margin:4px 0">Đáp án đúng: <b>${esc(d.correctAnswer)}</b></p>`:''}<p class="small muted" style="line-height:1.6;margin-bottom:0">${esc(d.explanation)}</p></div>`).join('')}</div><div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:28px"><button class="primary" onclick="goHome()">Về góc học tập</button><button class="secondary" onclick="startPreferences()">Khám phá tác phẩm khác</button><button class="ghost" onclick="openWork('${w.id}')">Đọc lại tác phẩm</button></div></section><div class="footer">Kết quả đã được lưu trên database dùng chung để giáo viên theo dõi.</div></main>`}
function teacherView(){const users=getUsers().filter(u=>u.role==='student'),all=getProgress(),rows=users.map(u=>{const p=all[u.id]||{works:{},sessions:[]},works=Object.values(p.works||{}),completed=works.filter(x=>x.status==='completed'),scores=completed.map(x=>x.score??x.lastResult?.score).filter(x=>typeof x==='number'),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;return {...u,p,completed:completed.length,started:works.filter(x=>x.status==='reading'||x.status==='quiz').length,avg,last:works.sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0))[0]||null}});const totalCompleted=rows.reduce((s,r)=>s+r.completed,0),totalScores=rows.flatMap(r=>Object.values(r.p.works||{}).filter(x=>x.status==='completed').map(x=>x.score??x.lastResult?.score).filter(n=>typeof n==='number')),classAvg=totalScores.length?Math.round(totalScores.reduce((a,b)=>a+b,0)/totalScores.length):0;return `${header()}<main class="wrap"><div class="row between" style="flex-wrap:wrap"><div><div class="eyebrow">Bảng điều khiển giáo viên</div><h1 style="font-size:42px;margin:10px 0">Theo dõi học tập</h1><p class="lead">Quan sát tiến độ đọc, kết quả câu hỏi và các hoạt động gần đây của học sinh.</p></div><button class="secondary" onclick="exportData()">↓ Xuất báo cáo CSV</button></div><section class="grid stats" style="margin:22px 0"><div class="stat"><strong>${users.length}</strong><span>Tài khoản học sinh</span></div><div class="stat"><strong>${totalCompleted}</strong><span>Lượt hoàn thành tác phẩm</span></div><div class="stat"><strong>${totalScores.length?classAvg+'%':'—'}</strong><span>Điểm trung bình bài đã nộp</span></div></section><section class="grid teacher-grid"><div class="panel"><div class="row between" style="margin-bottom:12px"><div><h2>Danh sách học sinh</h2><p class="small muted">Chọn một học sinh để xem chi tiết.</p></div><input id="student-search" class="field" placeholder="Tìm học sinh..." style="max-width:190px" oninput="filterStudents()"></div><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Lớp</th><th>Tiến độ</th><th>Điểm TB</th><th>Hoạt động</th></tr></thead><tbody id="student-table">${rows.map(teacherRow).join('')}</tbody></table></div><div id="student-detail"></div></div><aside class="grid"><div class="panel"><div class="eyebrow">Tổng quan lớp</div><h3 style="margin-top:8px">Lượt hoàn thành theo tác phẩm</h3>${WORKS.map(w=>{const count=users.reduce((s,u)=>s+((all[u.id]?.works?.[w.id]?.status==='completed')?1:0),0);return `<div class="barline"><span title="${esc(w.title)}">${esc(w.title.length>14?w.title.slice(0,13)+'…':w.title)}</span><div class="progress"><span style="width:${users.length?count/users.length*100:0}%"></span></div><b>${count}</b></div>`}).join('')}<p class="small muted" style="margin:18px 0 0">Số liệu được đồng bộ từ database của lớp học.</p></div><div class="panel"><div class="eyebrow">Hoạt động gần đây</div><h3 style="margin-top:8px">Dấu mốc học tập</h3><div class="activity-list">${recentActivities(users,all)}</div></div><div class="note">🔒 <b>Dữ liệu lớp học:</b> Học sinh chỉ xem và cập nhật tiến độ của mình; giáo viên xem được dữ liệu học sinh.</div></aside></section><div class="footer">Văn Học Mở · Bảng điều khiển giáo viên</div></main>`}
function teacherRow(r){const status=r.completed?'Đã học':r.started?'Đang học':'Chưa bắt đầu',cls=r.completed?'':r.started?'in-progress':'not-started';return `<tr class="student-row" data-name="${esc((r.name+' '+r.id).toLowerCase())}" onclick="showStudent('${r.id}')"><td><div class="row" style="gap:9px"><div class="avatar" style="width:31px;height:31px;font-size:10px">${esc(userInitials(r.name))}</div><span><b>${esc(r.name)}</b><br><span class="small muted">${esc(r.id)}</span></span></div></td><td>${esc(r.className||'—')}</td><td><span class="status ${cls}">${status}</span><br><span class="small muted">${r.completed} tác phẩm</span></td><td>${r.avg===null?'—':r.avg+'%'}</td><td>${r.last?new Date(r.last.updatedAt||0).toLocaleDateString('vi-VN'):'—'}</td></tr>`}
function filterStudents(){const q=$('student-search').value.toLowerCase();document.querySelectorAll('#student-table tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.name.includes(q)))}
function showStudent(id){const user=getUsers().find(u=>u.id===id),p=getUserProgress(id),works=WORKS.map(w=>({...w,pr:p.works?.[w.id]})).filter(w=>w.pr),d=$('student-detail');if(!d)return;d.innerHTML=`<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:20px"><div class="row between"><div><div class="eyebrow">Hồ sơ học tập</div><h3 style="margin:7px 0">${esc(user.name)}</h3><p class="small muted">Lớp ${esc(user.className||'—')} · ${esc(user.id.slice(0,8))}</p></div><button class="ghost" onclick="this.closest('#student-detail').innerHTML=''">Đóng</button></div>${works.length?works.map(w=>`<div style="border:1px solid var(--line);border-radius:14px;padding:14px;margin:11px 0"><div class="row between" style="align-items:flex-start;gap:10px"><div><b>${esc(w.title)}</b><div class="small muted" style="margin-top:5px">${w.pr.status==='completed'?'Đã hoàn thành':w.pr.status==='quiz'?'Đang làm bài':'Đang đọc'} · ${w.pr.updatedAt?new Date(w.pr.updatedAt).toLocaleString('vi-VN'):'—'}</div></div><span class="pill">${w.pr.score!==undefined?w.pr.score+'%':'Đang học'}</span></div>${w.pr.lastResult?`<div class="small" style="margin-top:12px">${w.pr.lastResult.details.map((a,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><span class="answer-tag ${a.isCorrect?'correct':'incorrect'}">Câu ${i+1}: ${a.isCorrect?'Đúng':'Sai'}</span><div style="margin-top:6px">${esc(a.question)}</div><div class="muted" style="margin-top:4px">Trả lời: ${esc(a.selected)}${a.isCorrect?'':` · Đáp án: ${esc(a.correctAnswer)}`}</div></div>`).join('')}</div>`:''}</div>`).join(''):`<div class="empty">Học sinh chưa có hoạt động được ghi nhận.</div>`}</div>`;d.scrollIntoView({behavior:'smooth',block:'nearest'})}
function recentActivities(users,all){const arr=[];users.forEach(u=>(all[u.id]?.sessions||[]).forEach(s=>arr.push({...s,name:u.name})));arr.sort((a,b)=>new Date(b.at)-new Date(a.at));if(!arr.length)return '<div class="empty">Chưa có hoạt động được ghi nhận.</div>';return arr.slice(0,6).map(a=>`<div class="activity"><span class="dot"></span><div><b>${esc(a.name)}</b><div>${esc(a.activity)} · ${esc(getWork(a.workId)?.title||'Tác phẩm')}</div><span class="small muted">${new Date(a.at).toLocaleString('vi-VN')}</span></div></div>`).join('')}
function exportData(){const users=getUsers().filter(u=>u.role==='student'),all=getProgress(),lines=[['Tài khoản','Họ tên','Lớp','Tác phẩm','Trạng thái','Điểm gần nhất','Số lượt làm','Thời gian cập nhật']];users.forEach(u=>WORKS.forEach(w=>{const p=all[u.id]?.works?.[w.id];if(p)lines.push([u.id,u.name,u.className||'',w.title,p.status,p.score??'',p.attempts||0,p.updatedAt||''])}));const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bao-cao-van-hoc-mo.csv';a.click();URL.revokeObjectURL(url);toast('Đã tạo báo cáo CSV.')}
// Functions called by inline event handlers remain in global scope.
async function loadCloudWorkspace(authUser){const profileResult=await db.from('profiles').select('id,email,name,class_name,role').eq('id',authUser.id).single();if(profileResult.error)throw profileResult.error;const profile=profileResult.data;state.user={id:profile.id,email:profile.email,name:profile.name,role:profile.role,className:profile.class_name||''};state.screen='home';const worksResult=await db.from('literary_works').select('id,title,author,genre,period,tags,level,mark,cover,description,reading,intro,questions').order('title');if(worksResult.error)throw worksResult.error;WORKS=worksResult.data||[];cloudUsers=[];if(profile.role==='teacher'){const usersResult=await db.from('profiles').select('id,email,name,class_name,role').eq('role','student').order('name');if(usersResult.error)throw usersResult.error;cloudUsers=usersResult.data.map(u=>({id:u.id,email:u.email,name:u.name,role:u.role,className:u.class_name||''}))}const [progressResult,sessionsResult]=await Promise.all([db.from('learning_progress').select('user_id,work_id,data,updated_at'),db.from('learning_sessions').select('user_id,work_id,activity,created_at').order('created_at',{ascending:false}).limit(500)]);if(progressResult.error)throw progressResult.error;if(sessionsResult.error)throw sessionsResult.error;const next={};for(const row of progressResult.data){next[row.user_id]??={works:{},sessions:[]};next[row.user_id].works[row.work_id]={...row.data,updatedAt:row.updated_at}}for(const row of sessionsResult.data){next[row.user_id]??={works:{},sessions:[]};next[row.user_id].sessions.push({workId:row.work_id,activity:row.activity,at:row.created_at})}cloudProgress=next}
async function boot(){const config=window.VHM_SUPABASE_CONFIG;if(!window.supabase||!config||!config.url||!config.publishableKey||config.url.includes('YOUR_PROJECT_REF')||config.publishableKey.includes('YOUR_')){state.cloudError='Kết nối cloud chưa được cấu hình. Mở SUPABASE_SETUP.md và điền Project URL cùng Publishable key.';render();return}try{db=window.supabase.createClient(config.url,config.publishableKey);const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session){await loadCloudWorkspace(data.session.user)}}catch(err){if(db){try{await db.auth.signOut()}catch{}}state.user=null;cloudUsers=[];cloudProgress={};state.cloudError='Không kết nối được Supabase: '+err.message}applyRouteFromHash();render()}
boot();
</script>
