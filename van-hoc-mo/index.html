*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:750;transition:.15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:var(--green);color:white}.secondary{background:var(--mint);color:var(--green)}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.soft{background:#f4f2e9;color:#6f5a2f}.danger{background:var(--rose);color:#973d2b}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px 26px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;letter-spacing:-.6px}.brandmark{width:44px;height:44px;background:var(--green);border-radius:15px;display:grid;place-items:center;color:white;font-size:22px}.brand small{display:block;font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:750;margin-top:1px}.userbar{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#e8d8bd;color:#705329;border-radius:50%;font-weight:900}.panel{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;color:var(--green2)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,4vw,50px);line-height:1.08;letter-spacing:-1.9px;margin:15px 0}h2{font-size:27px;letter-spacing:-.8px;margin-bottom:8px}h3{font-size:18px;letter-spacing:-.3px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.lead{font-size:16px;line-height:1.7;color:#626e66}.row{display:flex;align-items:center;gap: );z-index:20;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.chip{border:1px solid var(--line);background:#fff;color:#58665d;border-radius:99px;padding:9px 13px;font-size:13px}.chip.selected{background:var(--green);border-color:var(--green);color:#fff}.prefs-layout{grid-template-columns:.7fr 1.3fr;align-items:start}.note{background:#fff8e7;border:1px solid #f1e2bb;border-radius:15px;padding:15px;font-size:13px;color:#77643a;line-height:1.6}.reading-layout{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.reading-text{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.95;white-space:pre-line;color:#33433a}.reading-title{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:-.6px}.quote{border-left:3px solid var(--gold);padding:8px 0 8px 17px;color:#58655c;font-style:italic;margin:20px 0}.quiz-option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:14px;border-radius:13px;margin:9px 0;cursor:pointer;line-height:1.5}.quiz-option input{margin-top:5px;accent-color:var(--green)}.quiz-option:has(input:checked){border-color:var(--green2);background:#f1f7f2}.quiz-question{padding:18px 0;border-bottom:1px solid var(--line)}.teacher-grid{grid-template-columns:1.4fr .8fr;align-items:start}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.status{font-size:11px;font-weight:850;padding:6px 9px;border-radius:99px;background:#eff3ed;color:#427354}.status.in-progress{background:#fff3dc;color:#86672c}.status.not-started{background:#edf0f3;color:#6b7580}.student-row{cursor:pointer}.student-row:hover{background:#fafbf8}.barline{display:grid;grid-template-columns:100px 1fr 38px;align-items:center;gap:9px;margin:14px 0;font-size:12px}.barline .progress{height:9px}.empty{padding:30px;text-align:center;color:var(--muted)}.backlink{background:transparent;border:0;color:var(--green2);padding:0;font-weight:800}.footer{font-size:11px;color:#99a199;text-align:center;margin-top:32px}.answer-tag{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;border-radius:8px}.correct{color:#267349;background:#e4f5ea}.incorrect{color:#9e4b3e;background:#fbe9e5}.activity-list{display:grid;gap:10px}.activity{display:flex;gap:11px;align-items:flex-start;font-size:13px;padding:12px;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;flex:none}
@media(max-width:850px){.hero,.prefs-layout,.reading-layout,.teacher-grid{grid-template-columns:1fr}.work-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.login-shell{grid-template-columns:1fr}.login-left{display:none}.login-right{min-height:100vh}.stats{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.userbar>span{display:none}}

<script>
const WORKS = [
 {id:'qua-deo-ngang',title:'Qua Đèo Ngang',author:'Bà Huyện Thanh Quan',genre:'Thơ trung đại',period:'Thơ • Lớp 7',tags:['Thiên nhiên','Cảm xúc','Thơ','Tình quê'],level:'Cơ bản',mark:'詩',cover:'cover-green',description:'Cảnh đèo lúc chiều tà gợi nỗi cô đơn, nhớ nước thương nhà và tâm trạng của người lữ khách.',reading:`Bước tới Đèo Ngang, bóng xế tà,\nCỏ cây chen đá, lá chen hoa.\nLom khom dưới núi, tiều vài chú,\nLác đác bên sông, chợ mấy nhà.\nNhớ nước đau lòng con quốc quốc,\nThương nhà mỏi miệng cái gia gia.\nDừng chân đứng lại, trời, non, nước,\nMột mảnh tình riêng, ta với ta.`,intro:'Bài thơ khắc họa cảnh Đèo Ngang trong thời khắc chiều tà. Không gian rộng, vắng và những dấu hiệu sự sống thưa thớt làm nổi bật tâm trạng cô đơn, hoài cổ của nhân vật trữ tình.',questions:[{q:'Thời điểm được gợi ra ngay ở câu thơ đầu là gì?',opts:['Bình minh','Bóng xế tà','Đêm khuya','Buổi trưa'],a:1,why:'“Bóng xế tà” cho biết thời điểm chiều muộn, góp phần tạo sắc thái man mác buồn.'},{q:'Cụm từ “lom khom”, “lác đác” có tác dụng nổi bật nào?',opts:['Làm cảnh vật trở nên đông vui','Nhấn mạnh sự hùng vĩ dữ dội','Gợi dáng vẻ nhỏ bé, thưa vắng của sự sống','Miêu tả một phiên chợ náo nhiệt'],a:2,why:'Hai từ láy gợi hình làm nổi bật sự nhỏ bé và thưa thớt giữa không gian rộng lớn.'},{q:'“Một mảnh tình riêng, ta với ta” thể hiện điều gì?',opts:['Niềm vui hội ngộ','Tâm sự riêng tư, cô đơn của nhân vật trữ tình','Sự tức giận với người đi đường','Lời mời bạn bè đến chơi'],a:1,why:'Câu kết thu lại không gian vào thế giới nội tâm, nhấn mạnh nỗi cô đơn và tâm sự riêng.'}]},
 {id:'ban-den-choi-nha',title:'Bạn đến chơi nhà',author:'Nguyễn Khuyến',genre:'Thơ trào phúng / trữ tình',period:'Thơ • Lớp 7',tags:['Tình bạn','Hài hước','Thơ','Đời sống'],level:'Cơ bản',mark:'友',cover:'cover-gold',description:'Tiếng cười hóm hỉnh làm nổi bật tình bạn chân thành, vượt lên trên vật chất và lễ nghi.',reading:`Đã bấy lâu nay, bác tới nhà,\nTrẻ thời đi vắng, chợ thời xa.\nAo sâu nước cả, khôn chài cá,\nVườn rộng rào thưa, khó đuổi gà.\nCải chửa ra cây, cà mới nụ,\nBầu vừa rụng rốn, mướp đương hoa.\nĐầu trò tiếp khách, trầu không có,\nBác đến chơi đây, ta với ta.`,intro:'Bài thơ dựng lên tình huống tiếp bạn rất đặc biệt: mọi thứ tưởng như sẵn có lại đều thiếu hoặc chưa dùng được. Cách nói hóm hỉnh dẫn đến lời khẳng định tình bạn chân thành, không phụ thuộc mâm cao cỗ đầy.',questions:[{q:'Tình huống tiếp bạn trong bài thơ có điểm gì đặc biệt?',opts:['Gia chủ chuẩn bị rất chu đáo','Mọi thứ đều thiếu hoặc chưa thể dùng để đãi bạn','Hai người gặp nhau ngoài chợ','Bạn đến để vay tiền'],a:1,why:'Các chi tiết về trẻ, chợ, cá, gà, rau quả và trầu đều tạo nên tình huống thiếu thốn đầy hóm hỉnh.'},{q:'Giọng điệu chủ đạo của bài thơ là gì?',opts:['Hóm hỉnh, thân tình','Bi thương, tuyệt vọng','Oai nghiêm, trang trọng','Gay gắt, thù địch'],a:0,why:'Cách liệt kê những cái “không có” tạo tiếng cười nhẹ nhàng, thân mật.'},{q:'Thông điệp chính của bài thơ là gì?',opts:['Muốn có bạn phải giàu có','Lễ nghi quan trọng hơn tình cảm','Tình bạn chân thành không đặt nặng vật chất','Không nên đón khách ở nhà'],a:2,why:'Điều quý giá nhất khi bạn đến chơi là tình cảm chân thành, không phải đồ ăn thức uống.'}]},
 {id:'lao-hac',title:'Lão Hạc',author:'Nam Cao',genre:'Truyện ngắn hiện thực',period:'Truyện • Lớp 8',tags:['Gia đình','Xã hội','Cảm xúc','Đời sống'],level:'Trung bình',mark:'家',cover:'cover-rose',description:'Số phận người nông dân nghèo và vẻ đẹp của lòng tự trọng, tình yêu thương trong hoàn cảnh khốn cùng.',reading:`Lão Hạc là một người nông dân nghèo, sống cùng con chó mà lão yêu quý như một người thân. Con trai vì không đủ tiền cưới vợ nên bỏ đi làm đồn điền cao su. Lão ở lại một mình, làm thuê và chắt chiu từng chút để giữ mảnh vườn cho con.\n\nKhi bệnh tật, mất mùa khiến cuộc sống ngày càng khó khăn, lão buộc phải bán con chó. Quyết định ấy khiến lão đau đớn, day dứt. Lão gửi ông giáo tiền lo ma chay và nhờ giữ hộ mảnh vườn, quyết không tiêu vào phần của con.\n\nQua câu chuyện, người đọc thấy được cảnh nghèo đói bủa vây người nông dân trước Cách mạng, đồng thời cảm nhận tình yêu con sâu nặng, lòng tự trọng và nhân cách đáng quý của lão Hạc.`,intro:'Đây là phần đọc học tập tóm lược nội dung và chủ đề của truyện, không thay thế văn bản đầy đủ. Hãy chú ý mối quan hệ giữa hoàn cảnh nghèo đói, tình yêu con và lựa chọn giữ gìn lòng tự trọng của nhân vật.',questions:[{q:'Lão Hạc cố giữ lại mảnh vườn chủ yếu vì điều gì?',opts:['Muốn bán được giá cao','Muốn để lại cho con trai','Muốn xây nhà mới','Không thích người khác làm vườn'],a:1,why:'Mảnh vườn là phần lão muốn giữ lại cho con trai sau này.'},{q:'Việc bán cậu Vàng khiến lão Hạc cảm thấy thế nào?',opts:['Vui mừng vì có thêm tiền','Thờ ơ, không quan tâm','Đau đớn, day dứt','Tức giận với ông giáo'],a:2,why:'Con chó là người bạn thân thiết nên việc bán nó khiến lão đau khổ, ân hận.'},{q:'Phẩm chất nổi bật của lão Hạc qua câu chuyện là gì?',opts:['Ích kỷ và tham lam','Lòng tự trọng và tình yêu thương con','Ham danh vọng','Thích hưởng thụ'],a:1,why:'Dù nghèo khổ, lão vẫn nghĩ cho con và cố giữ gìn lòng tự trọng.'}]},
 {id:'chi-pheo',title:'Chí Phèo',author:'Nam Cao',genre:'Truyện ngắn hiện thực',period:'Truyện • Lớp 11',tags:['Xã hội','Cảm xúc','Tâm lý','Đời sống'],level:'Nâng cao',mark:'人',cover:'cover-blue',description:'Bi kịch bị cự tuyệt quyền làm người và khát vọng được trở lại với cộng đồng.',reading:`Chí Phèo vốn là một người nông dân hiền lành nhưng bị đẩy vào tù bởi những thế lực ở làng Vũ Đại. Khi trở về, Chí biến dạng cả về ngoại hình lẫn tính cách, thường xuyên say rượu và gây sự. Bá Kiến lợi dụng Chí như một công cụ để giải quyết mâu thuẫn.\n\nCuộc gặp gỡ với Thị Nở và bát cháo hành đem đến cho Chí một khoảnh khắc thức tỉnh. Lần đầu sau nhiều năm, Chí cảm nhận được sự chăm sóc giản dị và khao khát sống lương thiện. Nhưng định kiến của xã hội đã chặn mất con đường trở về.\n\nTác phẩm đặt ra câu hỏi đau đớn về quyền làm người: một con người có thể bị xã hội đẩy ra ngoài lề đến mức nào, và cộng đồng phải chịu trách nhiệm gì trước bi kịch ấy?`,intro:'Phần đọc này tóm lược các nút thắt chính và chủ đề nhân đạo của truyện. Khi học, hãy chú ý sự thay đổi tâm lý của Chí trước và sau cuộc gặp Thị Nở.',questions:[{q:'Bát cháo hành có ý nghĩa gì đối với Chí Phèo?',opts:['Chỉ giúp Chí no bụng','Khơi dậy cảm giác được yêu thương và khát vọng lương thiện','Khiến Chí muốn rời làng','Là món quà của Bá Kiến'],a:1,why:'Bát cháo hành là sự chăm sóc chân thành, giúp Chí thức tỉnh và khao khát trở lại làm người lương thiện.'},{q:'Bi kịch trung tâm của Chí Phèo là gì?',opts:['Không có tài sản thừa kế','Bị cự tuyệt quyền làm người và con đường trở về cộng đồng','Không muốn làm việc','Mất khả năng đọc viết'],a:1,why:'Tác phẩm phản ánh quá trình bị tha hóa và sự cự tuyệt của xã hội khi Chí muốn hoàn lương.'},{q:'Tác phẩm thể hiện rõ giá trị nhân đạo nào?',opts:['Ca ngợi bạo lực','Phủ nhận khả năng thay đổi của con người','Xót thương con người và phản ánh xã hội đã đẩy họ vào bi kịch','Khuyên người nghèo tránh giao tiếp'],a:2,why:'Tác phẩm lên án xã hội tàn nhẫn và thể hiện niềm cảm thương với khát vọng làm người.'}]},
 {id:'truyen-kieu',title:'Truyện Kiều',author:'Nguyễn Du',genre:'Truyện thơ Nôm',period:'Truyện thơ • Lớp 9',tags:['Tình yêu','Gia đình','Cảm xúc','Thơ'],level:'Trung bình',mark:'夢',cover:'cover-violet',description:'Tác phẩm lớn về số phận con người, tình yêu, chữ hiếu và khát vọng công lý.',reading:`Truyện Kiều kể về cuộc đời Thúy Kiều, một người con gái tài sắc. Vì biến cố gia đình, Kiều quyết định bán mình để cứu cha và em, từ đó trải qua nhiều năm lưu lạc, chịu nhiều bất công và đau khổ.\n\nTrên hành trình ấy, Kiều gặp những con người với tính cách và số phận khác nhau. Tác phẩm vừa khắc họa tài năng, phẩm giá và đời sống nội tâm phong phú của nhân vật, vừa phơi bày những thế lực đồng tiền và bất công đã chà đạp con người.\n\nQua số phận Thúy Kiều, Nguyễn Du thể hiện niềm thương cảm sâu sắc đối với con người, đặc biệt là người phụ nữ, đồng thời đặt ra những suy ngẫm về tình yêu, chữ hiếu và công lý.`,intro:'Phần đọc học tập tóm lược cốt truyện và chủ đề. Hãy nhìn nhận các lựa chọn của Thúy Kiều trong bối cảnh những ràng buộc gia đình và xã hội thời phong kiến.',questions:[{q:'Quyết định bán mình của Thúy Kiều xuất phát chủ yếu từ điều gì?',opts:['Mong muốn rời xa gia đình','Muốn cứu cha và em, thể hiện chữ hiếu','Muốn trở nên nổi tiếng','Muốn đi du lịch'],a:1,why:'Kiều hy sinh tình riêng và bản thân để cứu gia đình, thể hiện sâu sắc chữ hiếu.'},{q:'Một giá trị nhân đạo nổi bật của Truyện Kiều là gì?',opts:['Đề cao sự giàu có bằng mọi giá','Cảm thương số phận con người và người phụ nữ','Ủng hộ mọi bất công xã hội','Chỉ kể chuyện phiêu lưu'],a:1,why:'Nguyễn Du thể hiện sự cảm thông sâu sắc với những đau khổ và phẩm giá của con người.'},{q:'Tác phẩm được viết chủ yếu bằng thể loại nào?',opts:['Truyện thơ Nôm','Kịch nói','Tùy bút hiện đại','Sử thi bằng văn xuôi'],a:0,why:'Truyện Kiều là truyện thơ Nôm, viết bằng thể thơ lục bát.'}]},
 {id:'dong-chi',title:'Đồng chí',author:'Chính Hữu',genre:'Thơ hiện đại',period:'Thơ • Lớp 9',tags:['Tình bạn','Chiến tranh','Cảm xúc','Thơ'],level:'Cơ bản',mark:'兵',cover:'cover-teal',description:'Tình đồng đội hình thành từ chung cảnh ngộ, lý tưởng và những năm tháng chiến đấu gian khổ.',reading:`Bài thơ khắc họa những người lính xuất thân từ các miền quê nghèo, cùng chung nhiệm vụ và trải qua thiếu thốn nơi chiến trường. Từ những điểm tương đồng trong hoàn cảnh, họ thấu hiểu, sẻ chia và gắn bó với nhau.\n\nTình đồng chí hiện lên qua những chi tiết đời thường: cùng chịu rét, cùng chia sẻ khó khăn, cùng đứng bên nhau giữa đêm phục kích. Hình ảnh kết thúc giàu chất biểu tượng làm sáng lên vẻ đẹp bình dị mà kiên cường của người lính.`,intro:'Hãy đọc chú ý sự chuyển biến từ những điểm chung trong hoàn cảnh xuất thân đến sự gắn bó sâu sắc giữa những người lính.',questions:[{q:'Cơ sở hình thành tình đồng chí trong bài thơ là gì?',opts:['Lợi ích vật chất','Chung cảnh ngộ, lý tưởng và nhiệm vụ','Quan hệ họ hàng','Cạnh tranh thành tích'],a:1,why:'Sự tương đồng về xuất thân, nhiệm vụ và lý tưởng tạo nền tảng cho tình đồng chí.'},{q:'Tình đồng chí được thể hiện rõ nhất qua điều gì?',opts:['Sự xa cách','Chia sẻ thiếu thốn và cùng chiến đấu','Những lời khoe khoang','Sự giàu sang'],a:1,why:'Những chi tiết sinh hoạt và chiến đấu cho thấy sự gắn bó, sẻ chia của người lính.'},{q:'Giọng điệu chung của bài thơ là gì?',opts:['Chân thành, mộc mạc mà sâu sắc','Châm biếm gay gắt','Hài hước suốt bài','Lạnh lùng, khách quan'],a:0,why:'Ngôn ngữ mộc mạc tạo nên cảm xúc chân thành, sâu sắc.'}]}
];
const TAGS=['Thơ','Truyện','Tình bạn','Tình yêu','Gia đình','Thiên nhiên','Xã hội','Chiến tranh','Cảm xúc','Hài hước','Tâm lý','Đời sống'];
const DEFAULT_USERS=[{id:'student1',password:'123456',name:'Nguyễn Minh Anh',role:'student',className:'8A'},{id:'student2',password:'123456',name:'Trần Gia Bảo',role:'student',className:'8A'},{id:'student3',password:'123456',name:'Lê Thu Hà',role:'student',className:'8B'},{id:'teacher',password:'teacher123',name:'Cô Nguyễn Thu Hà',role:'teacher',className:'Giáo viên Ngữ văn'}];
let state={user:null,screen:'login',role:'student',selectedTags:[],activeWork:null,quizAnswers:{},quizIndex:0};
const $=id=>document.getElementById(id);
function readStore(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
function writeStore(key,value){localStorage.setItem(key,JSON.stringify(value))}
function getUsers(){return readStore('vhm_users',DEFAULT_USERS)}
function getProgress(){return readStore('vhm_progress',{})}
function getUserProgress(id){return getProgress()[id]||{works:{},sessions:[]}}
function userInitials(name){return name.split(' ').slice(-2).map(s=>s[0]).join('').toUpperCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}
function header(){return `<header class="topbar"><div class="brand"><div class="brandmark">文</div><div>VĂN HỌC MỞ<small>HỌC ĐỌC · SUY NGẪM · TRƯỞNG THÀNH</small></div></div>${state.user?`<div class="userbar"><div class="avatar">${esc(userInitials(state.user.name))}</div><span><b style="color:var(--ink)">${esc(state.user.name)}</b><br>${state.user.role==='teacher'?'Giáo viên':`Học sinh · ${esc(state.user.className||'')}`}</span><button class="ghost" onclick="logout()">Đăng xuất</button></div>`:''}</header>`}
function render(){const app=$('app');if(!state.user){app.innerHTML=loginView();return}if(state.user.role==='teacher'){app.innerHTML=teacherView();return}if(state.screen==='preferences'){app.innerHTML=header()+preferencesView();return}if(state.screen==='reading'){app.innerHTML=header()+readingView();return}if(state.screen==='quiz'){app.innerHTML=header()+quizView();return}app.innerHTML=header()+studentView()}
function loginView(){return `<div class="login-shell"><section class="login-left"><div class="brand" style="color:white"><div class="brandmark" style="background:#ffffff20">文</div><div>VĂN HỌC MỞ<small style="color:#c9dcd1">KHÔNG GIAN HỌC TẬP SỐ</small></div></div><div><div class="eyebrow">Đọc để hiểu mình, hiểu người</div><h1>Mỗi trang sách mở ra một cách nhìn mới.</h1><p>Một không gian học Ngữ văn nơi học sinh khám phá tác phẩm theo sở thích, luyện tập sau khi đọc và nhìn thấy hành trình tiến bộ của chính mình.</p></div><div style="font-size:12px;color:#c2d8cb;position:relative;z-index:1">© Văn Học Mở · Bản thử nghiệm học tập</div></section><section class="login-right"><div class="login-card"><div class="eyebrow">Chào mừng bạn</div><h2 style="margin-top:10px">Đăng nhập</h2><p class="muted">Chọn vai trò và đăng nhập để tiếp tục.</p><div class="role-switch"><button class="${state.role==='student'?'active':''}" onclick="setRole('student')">🎒 Học sinh</button><button class="${state.role==='teacher'?'active':''}" onclick="setRole('teacher')">📚 Giáo viên</button></div><form onsubmit="login(event)"><label class="form-label" for="username">Tài khoản</label><input class="field" id="username" autocomplete="username" placeholder="Nhập tên tài khoản" required><label class="form-label" for="password">Mật khẩu</label><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><div id="login-error" style="color:#ac4536;font-size:12px;margin-top:10px"></div><button class="primary" style="width:100%;margin-top:18px;padding:14px" type="submit">Đăng nhập →</button></form><div class="demo"><b>Tài khoản demo để trải nghiệm</b><br>Học sinh: <b>student1</b> / <b>123456</b><br>Giáo viên: <b>teacher</b> / <b>teacher123</b><br><button class="secondary" style="margin-top:10px;padding:8px 10px;font-size:11px" onclick="fillDemo()">Điền tài khoản mẫu</button></div><p class="small muted" style="margin-top:18px;line-height:1.6">Đây là bản demo lưu dữ liệu trong trình duyệt hiện tại. Không dùng mật khẩu thật hoặc dữ liệu học sinh nhạy cảm.</p></div></section></div>`}
function setRole(role){state.role=role;render()}
function fillDemo(){if($('username')){$('username').value=state.role==='teacher'?'teacher':'student1';$('password').value=state.role==='teacher'?'teacher123':'123456'}}
function login(e){e.preventDefault();const username=$('username').value.trim(),password=$('password').value;const user=getUsers().find(u=>u.id===username&&u.password===password&&u.role===state.role);if(!user){$('login-error').textContent='Tài khoản, mật khẩu hoặc vai trò chưa chính xác.';return}state.user=user;state.screen='home';state.selectedTags=[];if(user.role==='student'){const p=getUserProgress(user.id);p.lastSeen=new Date().toISOString();const all=getProgress();all[user.id]=p;writeStore('vhm_progress',all)}render()}
function logout(){state.user=null;state.screen='login';state.activeWork=null;state.quizAnswers={};render()}
function allWorksForStudent(){const p=getUserProgress(state.user.id);return WORKS.map(w=>({...w,progress:p.works[w.id]||{status:'not-started',attempts:0}}))}
function studentView(){const works=allWorksForStudent(),done=works.filter(w=>w.progress.status==='completed').length,inprogress=works.filter(w=>w.progress.status==='reading'||w.progress.status==='quiz').length,attempts=works.reduce((s,w)=>s+(w.progress.attempts||0),0);const continueWork=works.find(w=>w.progress.status==='reading'||w.progress.status==='quiz')||works.find(w=>w.progress.status==='not-started')||works[0];return `<main class="wrap"><section class="grid hero"><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><div class="eyebrow">Góc học tập của bạn</div><h1>Xin chào, ${esc(state.user.name.split(' ').slice(-1)[0])} 👋</h1><p class="lead">Mỗi tác phẩm là một hành trình. Hôm nay bạn muốn khám phá câu chuyện nào?</p><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="primary" onclick="startPreferences()">＋ Khám phá tác phẩm mới</button><button class="ghost" onclick="continueLearning('${continueWork.id}')">↗ Học tiếp</button></div><div class="stats"><div class="stat"><strong>${done}</strong><span>Tác phẩm hoàn thành</span></div><div class="stat"><strong>${inprogress}</strong><span>Đang học</span></div><div class="stat"><strong>${attempts}</strong><span>Lượt làm bài</span></div></div></div><div class="hero-art"><div class="art-copy"><span class="pill gold">Gợi ý hôm nay</span><h2>${esc(continueWork.title)}</h2><p style="color:#d6e4dc;line-height:1.6;font-size:13px">${esc(continueWork.description)}</p><button style="background:#fff;color:var(--green)" onclick="continueLearning('${continueWork.id}')">${continueWork.progress.status==='reading'||continueWork.progress.status==='quiz'?'Tiếp tục học':'Bắt đầu đọc'} →</button></div></div></section><div class="section-head"><div><div class="eyebrow">Tiến trình cá nhân</div><h2 style="margin:7px 0 4px">Học tiếp</h2><p class="muted small">Các tác phẩm bạn đã bắt đầu hoặc có thể đọc tiếp.</p></div><button class="ghost" onclick="startPreferences()">Tìm tác phẩm phù hợp</button></div><section class="grid work-grid">${works.filter(w=>w.progress.status==='reading'||w.progress.status==='quiz').length?works.filter(w=>w.progress.status==='reading'||w.progress.status==='quiz').map(workCard).join(''):`<div class="panel empty" style="grid-column:1/-1"><div style="font-size:28px;margin-bottom:8px">📖</div><b>Bạn chưa có tác phẩm đang học</b><p class="small">Chọn tác phẩm mới để bắt đầu hành trình nhé.</p></div>`}</section><div class="section-head"><div><div class="eyebrow">Thư viện chọn lọc</div><h2 style="margin:7px 0 4px">Tác phẩm nổi bật</h2><p class="muted small">Bắt đầu với một tác phẩm được giới thiệu trong thư viện.</p></div><span class="pill">${WORKS.length} tác phẩm</span></div><section class="grid work-grid">${works.slice(0,3).map(workCard).join('')}</section><div class="footer">Văn Học Mở · Tiến độ học tập được ghi nhận trên trình duyệt này.</div></main>`}
function workCard(w){const pr=w.progress||{status:'not-started'},status=pr.status==='completed'?'Đã hoàn thành':pr.status==='reading'?'Đang đọc':pr.status==='quiz'?'Đang làm bài':'Chưa bắt đầu';return `<article class="work-card"><div class="work-cover ${w.cover}" data-mark="${esc(w.mark)}"><span class="pill" style="background:#ffffffdd;color:#2e4d3e">${esc(w.level)}</span></div><div class="work-body"><div class="work-meta">${esc(w.period)} · ${esc(w.genre)}</div><h3 style="margin-top:7px">${esc(w.title)}</h3><div class="small muted">${esc(w.author)}</div><p>${esc(w.description)}</p><div class="row"><span class="small muted">${status}</span><button class="secondary" onclick="${pr.status==='reading'||pr.status==='quiz'?`continueLearning('${w.id}')`:`openWork('${w.id}')`}">${pr.status==='completed'?'Đọc lại':'Mở bài'} →</button></div></div></article>`}
function startPreferences(){state.screen='preferences';state.selectedTags=[];render()}
function preferencesView(){return `<main class="wrap"><button class="backlink" onclick="goHome()">← Về góc học tập</button><div style="margin:20px 0 24px"><div class="eyebrow">Cá nhân hóa hành trình</div><h1 style="font-size:40px;margin:10px 0">Bạn thích đọc về điều gì?</h1><p class="lead" style="max-width:680px">Chọn một hoặc nhiều chủ đề bạn quan tâm. Hệ thống sẽ ưu tiên gợi ý tác phẩm có nội dung gần với sở thích của bạn.</p></div><section class="grid prefs-layout"><aside class="panel"><h3>Chọn sở thích</h3><p class="muted small">Có thể chọn nhiều chủ đề.</p><div class="chips">${TAGS.map(t=>`<button class="chip ${state.selectedTags.includes(t)?'selected':''}" onclick="toggleTag('${t}')">${state.selectedTags.includes(t)?'✓ ':''}${t}</button>`).join('')}</div><div class="note" style="margin-top:20px">💡 <b>Mẹo:</b> Chọn cả thể loại (ví dụ “Thơ”) và chủ đề (ví dụ “Tình bạn”) để gợi ý sát hơn.</div><button class="primary" style="width:100%;margin-top:18px" onclick="recommendWorks()">Gợi ý tác phẩm phù hợp →</button></aside><section><div class="row between" style="margin-bottom:12px"><h3 style="margin:0">Thư viện tác phẩm</h3><span class="small muted" id="recommend-label">Chọn sở thích để sắp xếp</span></div><div id="recommend-list" class="grid work-grid">${WORKS.slice(0,3).map(w=>workCard({...w,progress:getUserProgress(state.user.id).works[w.id]||{status:'not-started'}})).join('')}</div></section></section><div class="footer">Gợi ý dựa trên thẻ chủ đề được gắn cho từng tác phẩm trong thư viện demo.</div></main>`}
function toggleTag(tag){state.selectedTags=state.selectedTags.includes(tag)?state.selectedTags.filter(t=>t!==tag):[...state.selectedTags,tag];render()}
function recommendWorks(){const selected=state.selectedTags;const progress=getUserProgress(state.user.id);let matched=WORKS.map(w=>({...w,score:w.tags.filter(t=>selected.includes(t)).length,progress:progress.works[w.id]||{status:'not-started'}})).sort((a,b)=>b.score-a.score);if(!selected.length)toast('Bạn chưa chọn sở thích, đang hiển thị thư viện nổi bật.');$('recommend-label').textContent=selected.length?`Ưu tiên ${selected.length} chủ đề`:'Tất cả tác phẩm';$('recommend-list').innerHTML=matched.map(w=>workCard(w)).join('');if(selected.length&&matched[0].score===0)toast('Chưa có tác phẩm khớp hoàn toàn; đây là gợi ý gần nhất.');}
function getWork(id){return WORKS.find(w=>w.id===id)}
function updateProgress(workId,patch,activity){const all=getProgress(),userId=state.user.id,p=all[userId]||{works:{},sessions:[]},old=p.works[workId]||{status:'not-started',attempts:0};p.works[workId]={...old,...patch,updatedAt:new Date().toISOString()};p.sessions=p.sessions||[];if(activity)p.sessions.unshift({workId,activity,at:new Date().toISOString()});all[userId]=p;writeStore('vhm_progress',all)}
function openWork(id){state.activeWork=id;state.screen='reading';const old=getUserProgress(state.user.id).works[id]||{};updateProgress(id,{status:'reading',startedAt:old.startedAt||new Date().toISOString()},'Bắt đầu đọc');render()}
function continueLearning(id){const pr=getUserProgress(state.user.id).works[id];if(pr?.status==='quiz'){state.activeWork=id;state.quizAnswers={};state.screen='quiz';render()}else openWork(id)}
function goHome(){state.screen='home';render()}
function readingView(){const w=getWork(state.activeWork);if(!w){goHome();return ''}return `<main class="wrap"><button class="backlink" onclick="goHome()">← Về góc học tập</button><div class="row between" style="margin:20px 0;flex-wrap:wrap"><div><div class="eyebrow">Không gian đọc</div><p class="muted small" style="margin:7px 0 0">${esc(w.period)} · ${esc(w.author)}</p></div><span class="pill">Bước 1 / 2 · Đọc tác phẩm</span></div><section class="grid reading-layout"><article class="panel"><div class="work-meta">${esc(w.genre)}</div><h1 class="reading-title">${esc(w.title)}</h1><p class="muted">${esc(w.author)}</p><div class="quote">${esc(w.intro)}</div><div class="reading-text">${esc(w.reading)}</div><div style="border-top:1px solid var(--line);margin-top:25px;padding-top:22px" class="row between"><span class="small muted">Đọc kỹ trước khi làm câu hỏi kiểm tra.</span><button class="primary" onclick="goQuiz()">Đọc xong · Tiếp tục →</button></div></article><aside class="grid"><div class="panel"><div class="eyebrow">Gợi ý đọc hiểu</div><h3 style="margin-top:8px">Đọc chủ động</h3><p class="small muted" style="line-height:1.7">Trong lúc đọc, hãy chú ý nhân vật trung tâm, bối cảnh, chi tiết nổi bật và cảm xúc hoặc thông điệp của tác phẩm.</p><div class="progress"><span style="width:50%"></span></div><p class="small muted" style="margin:8px 0 0">Tiến trình: Đang đọc</p></div><div class="panel"><div class="eyebrow">Chủ đề</div><div class="chips" style="margin-bottom:0">${w.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div></aside></section><div class="footer">Nội dung tóm lược trong bản demo nhằm hỗ trợ đọc hiểu, không thay thế văn bản tác phẩm đầy đủ.</div></main>`}
function goQuiz(){updateProgress(state.activeWork,{status:'quiz',readAt:new Date().toISOString()},'Hoàn tất phần đọc');state.screen='quiz';state.quizAnswers={};render()}
function quizView(){const w=getWork(state.activeWork);if(!w){goHome();return ''}return `<main class="wrap"><button class="backlink" onclick="state.screen='reading';render()">← Quay lại phần đọc</button><div style="margin:20px 0"><div class="eyebrow">Kiểm tra sau khi đọc</div><h1 style="font-size:40px;margin:10px 0">Bạn hiểu tác phẩm đến đâu?</h1><p class="lead">${esc(w.title)} · ${w.questions.length} câu hỏi trắc nghiệm</p></div><form onsubmit="submitQuiz(event)"><section class="panel"><div class="row between"><h2>${esc(w.title)}</h2><span class="pill">Bước 2 / 2 · Làm bài</span></div>${w.questions.map((q,i)=>`<div class="quiz-question"><b>Câu ${i+1}.</b> ${esc(q.q)}${q.opts.map((o,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}" ${state.quizAnswers[i]===j?'checked':''} required><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}<div class="row between" style="margin-top:22px;flex-wrap:wrap"><span class="small muted">Câu trả lời và kết quả sẽ được lưu để giáo viên theo dõi.</span><button type="submit" class="primary">Nộp bài và xem kết quả →</button></div></section></form></main>`}
function submitQuiz(e){e.preventDefault();const w=getWork(state.activeWork),answers=w.questions.map((q,i)=>Number(new FormData(e.target).get('q'+i))),correct=answers.filter((a,i)=>a===w.questions[i].a).length,score=Math.round(correct/w.questions.length*100),old=getUserProgress(state.user.id).works[w.id]||{};const attempt={score,correct,total:w.questions.length,answers,submittedAt:new Date().toISOString(),details:w.questions.map((q,i)=>({question:q.q,selected:q.opts[answers[i]],correctAnswer:q.opts[q.a],isCorrect:answers[i]===q.a,explanation:q.why}))};const attempts=[...(old.results||[]),attempt];updateProgress(w.id,{status:'completed',attempts:attempts.length,score,lastResult:attempt,results:attempts,completedAt:new Date().toISOString()},`Hoàn thành bài kiểm tra · ${score}%`);state.screen='result';state.result=attempt;renderResult()}
function renderResult(){const app=$('app'),w=getWork(state.activeWork),r=state.result;app.innerHTML=header()+`<main class="wrap"><section class="panel" style="max-width:780px;margin:24px auto;text-align:center;padding:clamp(24px,5vw,50px)"><div style="font-size:48px">${r.score>=70?'🎉':'🌱'}</div><div class="eyebrow" style="margin-top:12px">Kết quả của bạn</div><h1 style="font-size:44px;margin:12px">${r.score}/100 điểm</h1><p class="lead">Bạn trả lời đúng <b>${r.correct}/${r.total}</b> câu hỏi trong tác phẩm <b>${esc(w.title)}</b>.</p><div class="progress" style="height:11px;max-width:440px;margin:22px auto"><span style="width:${r.score}%"></span></div><p class="muted">${r.score>=70?'Bạn đã nắm được nhiều ý chính. Hãy xem lại phần giải thích để ghi nhớ sâu hơn.':'Đừng nản nhé! Đọc lại phần giải thích, sau đó bạn có thể thử một tác phẩm khác.'}</p><div style="text-align:left;margin-top:30px">${r.details.map((d,i)=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="row between"><b class="small">Câu ${i+1}. ${esc(d.question)}</b><span class="answer-tag ${d.isCorrect?'correct':'incorrect'}">${d.isCorrect?'Đúng':'Chưa đúng'}</span></div><p class="small" style="margin:9px 0 4px">Bạn chọn: ${esc(d.selected)}</p>${!d.isCorrect?`<p class="small" style="margin:4px 0">Đáp án đúng: <b>${esc(d.correctAnswer)}</b></p>`:''}<p class="small muted" style="line-height:1.6;margin-bottom:0">${esc(d.explanation)}</p></div>`).join('')}</div><div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:28px"><button class="primary" onclick="goHome()">Về góc học tập</button><button class="secondary" onclick="startPreferences()">Khám phá tác phẩm khác</button><button class="ghost" onclick="openWork('${w.id}')">Đọc lại tác phẩm</button></div></section><div class="footer">Kết quả đã được lưu trên trình duyệt này để giáo viên xem trong bảng theo dõi demo.</div></main>`}
function teacherView(){const users=getUsers().filter(u=>u.role==='student'),all=getProgress(),rows=users.map(u=>{const p=all[u.id]||{works:{},sessions:[]},works=Object.values(p.works||{}),completed=works.filter(x=>x.status==='completed'),scores=completed.map(x=>x.score??x.lastResult?.score).filter(x=>typeof x==='number'),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;return {...u,p,completed:completed.length,started:works.filter(x=>x.status==='reading'||x.status==='quiz').length,avg,last:works.sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0))[0]||null}});const totalCompleted=rows.reduce((s,r)=>s+r.completed,0),totalScores=rows.flatMap(r=>Object.values(r.p.works||{}).filter(x=>x.status==='completed').map(x=>x.score??x.lastResult?.score).filter(n=>typeof n==='number')),classAvg=totalScores.length?Math.round(totalScores.reduce((a,b)=>a+b,0)/totalScores.length):0;return `${header()}<main class="wrap"><div class="row between" style="flex-wrap:wrap"><div><div class="eyebrow">Bảng điều khiển giáo viên</div><h1 style="font-size:42px;margin:10px 0">Theo dõi học tập</h1><p class="lead">Quan sát tiến độ đọc, kết quả câu hỏi và các hoạt động gần đây của học sinh.</p></div><button class="secondary" onclick="exportData()">↓ Xuất báo cáo CSV</button></div><section class="grid stats" style="margin:22px 0"><div class="stat"><strong>${users.length}</strong><span>Tài khoản học sinh demo</span></div><div class="stat"><strong>${totalCompleted}</strong><span>Lượt hoàn thành tác phẩm</span></div><div class="stat"><strong>${totalScores.length?classAvg+'%':'—'}</strong><span>Điểm trung bình bài đã nộp</span></div></section><section class="grid teacher-grid"><div class="panel"><div class="row between" style="margin-bottom:12px"><div><h2>Danh sách học sinh</h2><p class="small muted">Chọn một học sinh để xem chi tiết.</p></div><input id="student-search" class="field" placeholder="Tìm học sinh..." style="max-width:190px" oninput="filterStudents()"></div><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Lớp</th><th>Tiến độ</th><th>Điểm TB</th><th>Hoạt động</th></tr></thead><tbody id="student-table">${rows.map(teacherRow).join('')}</tbody></table></div><div id="student-detail"></div></div><aside class="grid"><div class="panel"><div class="eyebrow">Tổng quan lớp</div><h3 style="margin-top:8px">Lượt hoàn thành theo tác phẩm</h3>${WORKS.map(w=>{const count=users.reduce((s,u)=>s+((all[u.id]?.works?.[w.id]?.status==='completed')?1:0),0);return `<div class="barline"><span title="${esc(w.title)}">${esc(w.title.length>14?w.title.slice(0,13)+'…':w.title)}</span><div class="progress"><span style="width:${users.length?count/users.length*100:0}%"></span></div><b>${count}</b></div>`}).join('')}<p class="small muted" style="margin:18px 0 0">Số liệu được tính từ kết quả đã lưu trong trình duyệt hiện tại.</p></div><div class="panel"><div class="eyebrow">Hoạt động gần đây</div><h3 style="margin-top:8px">Dấu mốc học tập</h3><div class="activity-list">${recentActivities(users,all)}</div></div><div class="note">🔒 <b>Lưu ý dữ liệu:</b> Đây là bảng theo dõi demo. Các máy hoặc trình duyệt khác không tự đồng bộ. Để triển khai cho lớp học thật cần tài khoản có xác thực phía máy chủ, phân quyền và cơ sở dữ liệu chung.</div></aside></section><div class="footer">Văn Học Mở · Bảng điều khiển giáo viên</div></main>`}
function teacherRow(r){const status=r.completed?'Đã học':r.started?'Đang học':'Chưa bắt đầu',cls=r.completed?'':r.started?'in-progress':'not-started';return `<tr class="student-row" data-name="${esc((r.name+' '+r.id).toLowerCase())}" onclick="showStudent('${r.id}')"><td><div class="row" style="gap:9px"><div class="avatar" style="width:31px;height:31px;font-size:10px">${esc(userInitials(r.name))}</div><span><b>${esc(r.name)}</b><br><span class="small muted">${esc(r.id)}</span></span></div></td><td>${esc(r.className||'—')}</td><td><span class="status ${cls}">${status}</span><br><span class="small muted">${r.completed} tác phẩm</span></td><td>${r.avg===null?'—':r.avg+'%'}</td><td>${r.last?new Date(r.last.updatedAt||0).toLocaleDateString('vi-VN'):'—'}</td></tr>`}
function filterStudents(){const q=$('student-search').value.toLowerCase();document.querySelectorAll('#student-table tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.name.includes(q)))}
function showStudent(id){const user=getUsers().find(u=>u.id===id),p=getUserProgress(id),works=WORKS.map(w=>({...w,pr:p.works?.[w.id]})).filter(w=>w.pr),d=$('student-detail');if(!d)return;d.innerHTML=`<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:20px"><div class="row between"><div><div class="eyebrow">Hồ sơ học tập</div><h3 style="margin:7px 0">${esc(user.name)}</h3><p class="small muted">Lớp ${esc(user.className||'—')} · ${esc(user.id)}</p></div><button class="ghost" onclick="this.closest('#student-detail').innerHTML=''">Đóng</button></div>${works.length?works.map(w=>`<div style="border:1px solid var(--line);border-radius:14px;padding:14px;margin:11px 0"><div class="row between" style="align-items:flex-start;gap:10px"><div><b>${esc(w.title)}</b><div class="small muted" style="margin-top:5px">${w.pr.status==='completed'?'Đã hoàn thành':w.pr.status==='quiz'?'Đang làm bài':'Đang đọc'} · ${w.pr.updatedAt?new Date(w.pr.updatedAt).toLocaleString('vi-VN'):'—'}</div></div><span class="pill">${w.pr.score!==undefined?w.pr.score+'%':'Đang học'}</span></div>${w.pr.lastResult?`<div class="small" style="margin-top:12px">${w.pr.lastResult.details.map((a,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><span class="answer-tag ${a.isCorrect?'correct':'incorrect'}">Câu ${i+1}: ${a.isCorrect?'Đúng':'Sai'}</span><div style="margin-top:6px">${esc(a.question)}</div><div class="muted" style="margin-top:4px">Trả lời: ${esc(a.selected)}${a.isCorrect?'':` · Đáp án: ${esc(a.correctAnswer)}`}</div></div>`).join('')}</div>`:''}</div>`).join(''):`<div class="empty">Học sinh chưa có hoạt động được ghi nhận.</div>`}</div>`;d.scrollIntoView({behavior:'smooth',block:'nearest'})}
function recentActivities(users,all){const arr=[];users.forEach(u=>(all[u.id]?.sessions||[]).forEach(s=>arr.push({...s,name:u.name})));arr.sort((a,b)=>new Date(b.at)-new Date(a.at));if(!arr.length)return '<div class="empty">Chưa có hoạt động được ghi nhận.</div>';return arr.slice(0,6).map(a=>`<div class="activity"><span class="dot"></span><div><b>${esc(a.name)}</b><div>${esc(a.activity)} · ${esc(getWork(a.workId)?.title||'Tác phẩm')}</div><span class="small muted">${new Date(a.at).toLocaleString('vi-VN')}</span></div></div>`).join('')}
function exportData(){const users=getUsers().filter(u=>u.role==='student'),all=getProgress(),lines=[['Tài khoản','Họ tên','Lớp','Tác phẩm','Trạng thái','Điểm gần nhất','Số lượt làm','Thời gian cập nhật']];users.forEach(u=>WORKS.forEach(w=>{const p=all[u.id]?.works?.[w.id];if(p)lines.push([u.id,u.name,u.className||'',w.title,p.status,p.score??'',p.attempts||0,p.updatedAt||''])}));const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bao-cao-van-hoc-mo.csv';a.click();URL.revokeObjectURL(url);toast('Đã tạo báo cáo CSV.')}
// Render functions are exposed to inline event handlers in this standalone demo.
render();
</script>
